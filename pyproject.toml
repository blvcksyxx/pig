[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pig-pm"
dynamic = ["version"]
description = "minimal package manager for linux (stdlib only)"
readme = "README.md"
requires-python = ">=3.8"
license = "PolyForm-Noncommercial-1.0.0"
authors = [{ name = "@blvcksyxx" }]
keywords = ["package-manager", "linux", "apt", "standalone"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Installation/Setup",
]
urls = { Homepage = "https://github.com/blvcksyxx/pig" }

[project.scripts]
pig = "pig:main"

[tool.setuptools]
py-modules = ["pig"]

[tool.setuptools.dynamic]
version = { attr = "pig.VERSION" }
